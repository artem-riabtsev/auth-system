version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: auth_system_postgres
    environment:
      POSTGRES_DB: auth_system_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: